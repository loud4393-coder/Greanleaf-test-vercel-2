<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greenleaf — каталог</title>
<style>
body{font-family:system-ui,sans-serif;max-width:820px;margin:auto;padding:24px 16px;background:#f7f7f5}
.grid{display:grid;gap:12px}.card,.admin{background:#fff;border-radius:14px;padding:16px;margin-top:12px;box-shadow:0 2px 10px #0001}
input,textarea{box-sizing:border-box;width:100%;padding:10px;margin:5px 0 10px;font:inherit;border:1px solid #ccc;border-radius:9px}
button{padding:10px 14px;border:0;border-radius:9px;margin:4px;cursor:pointer}.price{font-weight:700;margin-top:8px}
</style></head><body>
<h1>Greenleaf</h1><div id="status">Загрузка…</div><main id="products" class="grid"></main>
<section class="admin"><h2>Управление каталогом</h2>
<p>Тестовая админка. Защиту добавим позже.</p>
<input id="name" placeholder="Название"><input id="price" type="number" min="0" step=".01" placeholder="Цена">
<input id="currency" value="TMT" placeholder="Валюта"><textarea id="description" placeholder="Описание"></textarea>
<button id="save">Добавить товар</button><button id="cancel" hidden>Отмена</button><div id="msg"></div>
</section><script src="/static/script.js"></script></body></html>
